dev_dependencies:
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon.jpeg"
  
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:

