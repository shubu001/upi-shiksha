name: upi_shiksha
description: A new Flutter project.

publish_to: 'none' # Remove this line if you want to publish

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  
  flutter:
    sdk: flutter

  particles_flutter: ^0.1.4
  firebase_core: ^2.32.0
  firebase_auth: ^4.19.0

  mobile_scanner: ^3.5.2

  audioplayers: ^5.2.1

  qr_flutter: ^4.1.0

  cupertino_icons: ^1.0.6
  firebase_app_check: ^0.2.2+7
